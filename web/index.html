<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0c1411" />
    <meta name="description" content="A dark-first, offline-friendly Kerala PSC study coach for LDC, 10th, Plus Two and Degree-level exams." />
    <meta name="color-scheme" content="dark light" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://generativelanguage.googleapis.com https://openrouter.ai; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PSC Coach" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/icon-180.png" />
    <link rel="stylesheet" href="./css/app.css" />
    <title>Kerala PSC Coach</title>
  </head>
  <body>
    <div id="app">
      <div class="boot-screen" role="status">
        <div class="brand-mark" aria-hidden="true">PSC</div>
        <p>Preparing your offline study space…</p>
      </div>
    </div>
    <div id="toast-root" class="toast-root" aria-live="assertive" aria-atomic="true"></div>
    <noscript><main class="noscript-card"><h1>Kerala PSC Coach</h1><p>This installable study app needs JavaScript enabled. Your study profile remains on your device.</p></main></noscript>
    <script type="module" src="./js/app.js"></script>
  </body>
</html>
